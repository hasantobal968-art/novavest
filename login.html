<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaVest — تسجيل الدخول</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#030a12;
  color:#eef2f6;
  font-family:Tahoma,Arial,sans-serif;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(circle at 50% 20%,#112238,#030a12 55%);
}

.box{
  width:min(430px,92%);
  padding:35px;
  background:#08111b;
  border:1px solid #1e2c3a;
  border-radius:18px;
  text-align:center;
}

.logo{
  font-size:55px;
  font-weight:900;
  font-style:italic;
  color:#f2b632;
}

h1{
  margin:10px 0;
}

p{
  color:#8793a0;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  background:#050c14;
  border:1px solid #283746;
  border-radius:8px;
  color:white;
  direction:rtl;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#f2b632;
  color:#081019;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.message{
  margin-top:15px;
  color:#e0bb59;
  font-size:13px;
}

.back{
  display:block;
  margin-top:20px;
  color:#f2b632;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="auth">

  <div class="box">

    <div class="logo">N</div>

    <h1>تسجيل الدخول</h1>

    <p>مرحبًا بك في NovaVest</p>

    <input
      id="email"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button onclick="login()">
      تسجيل الدخول
    </button>

    <div id="message" class="message"></div>

    <a class="back" href="index.html">
      العودة إلى الرئيسية
    </a>

  </div>

</div>

<script>
function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("message");

  if(email === "" || password === ""){
    message.textContent =
      "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
    return;
  }

  message.textContent =
    "هذه نسخة تجريبية فقط — لم يتم تسجيل الدخول إلى حساب حقيقي.";
}
</script>

</body>
</html>
